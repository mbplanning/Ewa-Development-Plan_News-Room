<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ʻEwa Development Plan News Room</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/newsroom.css?v=header1">
</head>
<body>
  <header class="site-header">
    <div class="header-brand">
      <img class="logo" src="assets/ewa-dp-logo.png" alt="ʻEwa Development Plan">
      <div class="header-text">
        <h1>ʻEwa Development Plan News Room</h1>
        <p id="today-date" class="today-date"></p>
        <div class="header-tools">
          <button type="button" id="save-board">Save</button>
          <button type="button" id="undo-board" disabled>Reverse a step</button>
        </div>
      </div>
    </div>
    <form id="upload-form" class="upload-box" enctype="multipart/form-data">
      <p class="upload-label">Upload</p>
      <input id="upload-file" type="file" name="file" accept=".pdf,.docx,.txt,.md,.text" required>
      <input id="upload-link" type="text" name="sourceUrl" placeholder="Optional link">
      <button type="submit">Review news</button>
      <p id="upload-status" class="upload-status" hidden></p>
    </form>
  </header>

  <main class="page">
    <section class="news-column" aria-label="Recent news">
      <div class="news-heading">
        <h2>Recent news</h2>
        <label class="news-search-label">
          Search
          <input id="news-search" type="text" name="search" placeholder="Titles, summaries, document text" autocomplete="off">
        </label>
      </div>
      <label class="show-archived">
        <input type="checkbox" id="show-archived">
        Show archived
      </label>
      <ul id="news-list"></ul>
    </section>
    <aside class="map-column" aria-label="Location map">
      <div class="map-heading">
        <h2>Map</h2>
        <p id="map-hint" class="map-hint">Open a news item to move or redraw its location.</p>
      </div>
      <div class="map-toolbar">
        <label class="map-type-label">
          Mark as
          <select id="map-location-type">
            <option value="">Not identified</option>
            <option value="point">Dot / site</option>
            <option value="road">Line / road</option>
            <option value="region">Shape / region</option>
          </select>
        </label>
        <button type="button" id="map-done" disabled>Done</button>
        <button type="button" id="map-add-point" disabled>Add point</button>
        <button type="button" id="map-remove-point" disabled>Remove point</button>
        <button type="button" id="map-edit" disabled>Edit point</button>
        <button type="button" id="map-redraw" disabled>Redraw</button>
        <button type="button" id="map-finish">Finish</button>
        <button type="button" id="map-save" disabled>Save location</button>
      </div>
      <div id="news-map" class="news-map"></div>
    </aside>
  </main>

  <script src="data/projects.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/places.js?v=map7"></script>
  <script src="js/map.js?v=map7"></script>
  <script src="js/news.js?v=header1"></script>
</body>
</html>
