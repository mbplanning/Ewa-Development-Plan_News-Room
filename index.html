<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ʻEwa Development Plan News Room</title>
  <link rel="stylesheet" href="css/newsroom.css?v=norelated">
</head>
<body>
  <header class="site-header">
    <div class="header-brand">
      <img class="logo" src="assets/ewa-dp-logo.png" alt="ʻEwa Development Plan">
      <div class="header-text">
        <h1>ʻEwa Development Plan News Room</h1>
      </div>
    </div>
    <form id="upload-form" class="upload-box" enctype="multipart/form-data">
      <p class="upload-label">Upload</p>
      <input id="upload-file" type="file" name="file" accept=".pdf,.docx,.txt,.md,.text" required>
      <input id="upload-link" type="text" name="sourceUrl" placeholder="Optional link">
      <button type="submit">Review news</button>
      <p id="upload-status" class="upload-status" hidden></p>
    </form>
  </header>

  <main class="page">
    <section class="news-column" aria-label="Recent news">
      <div class="news-heading">
        <h2>Recent news</h2>
        <label class="news-search-label">
          Search
          <input id="news-search" type="text" name="search" placeholder="Titles, summaries, document text" autocomplete="off">
        </label>
      </div>
      <label class="show-archived">
        <input type="checkbox" id="show-archived">
        Show archived
      </label>
      <ul id="news-list"></ul>
    </section>
  </main>

  <script src="data/projects.js"></script>
  <script src="js/news.js?v=norelated"></script>
</body>
</html>
